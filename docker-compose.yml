services:
  api:
    build: ./services/api
    container_name: simqin-json-api
    environment:
      - STORAGE_DIR=/data/storage
      - WORKER_BASE_URL=http://worker:8090
      - SIMQIN_USER_ID=${SIMQIN_USER_ID:-reviewer-b}
      - SIMQIN_ROLE=${SIMQIN_ROLE:-reviewer}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./.storage:/data/storage
      - ./shared:/app/shared:ro
    depends_on:
      worker:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: simqin-json-worker
    environment:
      - STORAGE_DIR=/data/storage
    expose:
      - "8090"
    volumes:
      - ./.storage:/data/storage
      - ./shared:/app/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/v1/content/schemas', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: simqin-json-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:${API_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
