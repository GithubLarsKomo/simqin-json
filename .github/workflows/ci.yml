name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/worker/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall app

      - name: Verify Phase 6 worker entrypoint
        run: |
          python - <<'PY'
          from app.phase6_main import app
          paths = {route.path for route in app.routes}
          required = {
              '/api/v1/content/resolve',
              '/api/v1/content/canonical-snapshots',
              '/api/v1/content/canonical-snapshots/{object_id}/{revision}',
              '/api/v1/configuration/parameters',
              '/api/v1/configuration/parameters/{parameter_id}/{revision}',
              '/api/v1/translations/variants',
              '/api/v1/translations/variants/{variant_id}/{revision}',
              '/api/v1/translations/variants/{variant_id}/{revision}/history',
              '/api/v1/translations/variants/{variant_id}/{revision}/status',
              '/api/v1/ifu/release-candidates',
              '/api/v1/ifu/release-candidates/{candidate_id}',
              '/api/v1/ifu/release-candidates/{candidate_id}/history',
              '/api/v1/ifu/release-candidates/{candidate_id}/decision',
              '/api/v1/ifu/releases',
              '/api/v1/ifu/releases/{release_id}',
              '/api/v1/ifu/releases/verify',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f'Missing Phase 6 worker routes: {missing}')
          print('verified Phase 6 worker routes')
          PY

      - name: Run test suite
        run: pytest tests -q

      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for

          schema_root = Path('schemas')
          paths = sorted(schema_root.rglob('*.schema.json'))
          if not paths:
              raise SystemExit('No JSON schemas found')
          for path in paths:
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator_for(schema).check_schema(schema)
              print(f'valid schema: {path}')
          PY

  gateway:
    name: API gateway contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile gateway
        run: python -m compileall app

      - name: Verify Phase 6 gateway routes
        run: |
          python - <<'PY'
          from app.phase6_main import app
          paths = {route.path for route in app.routes}
          required = {
              '/api/v1/session',
              '/api/v1/content/schemas',
              '/api/v1/content/graph',
              '/api/v1/content/validate',
              '/api/v1/content/resolve',
              '/api/v1/content/canonical-snapshots',
              '/api/v1/content/canonical-snapshots/{object_id}/{revision}',
              '/api/v1/configuration/parameters',
              '/api/v1/configuration/parameters/{parameter_id}/{revision}',
              '/api/v1/translations/validate',
              '/api/v1/translations/variants',
              '/api/v1/translations/variants/{variant_id}/{revision}',
              '/api/v1/translations/variants/{variant_id}/{revision}/history',
              '/api/v1/translations/variants/{variant_id}/{revision}/status',
              '/api/v1/ifu/release-candidates',
              '/api/v1/ifu/release-candidates/{candidate_id}',
              '/api/v1/ifu/release-candidates/{candidate_id}/history',
              '/api/v1/ifu/release-candidates/{candidate_id}/decision',
              '/api/v1/ifu/releases',
              '/api/v1/ifu/releases/{release_id}',
              '/api/v1/ifu/releases/verify',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f'Missing Phase 6 gateway routes: {missing}')
          print('verified Phase 6 gateway routes')
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check and build
        run: npm run build

      - name: Verify multi-page output
        run: |
          test -f dist/index.html
          test -f dist/phase6.html
          echo 'verified dist/index.html and dist/phase6.html'
